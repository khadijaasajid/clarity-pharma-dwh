version: '3.8'

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    STAGING_DB_CONN: postgresql+psycopg2://staging:staging@postgres-staging:5432/staging
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/data
    - ./scripts:/opt/airflow/scripts
    - ./sql:/opt/airflow/sql
    - ./duckdb:/opt/airflow/duckdb
  depends_on:
    postgres-airflow:
      condition: service_healthy
    postgres-staging:
      condition: service_healthy

services:
  # PostgreSQL for Airflow metadata
  postgres-airflow:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    volumes:
      - pgdata-airflow:/var/lib/postgresql/data

  # PostgreSQL for Staging/ODS
  postgres-staging:
    image: postgres:15
    environment:
      POSTGRES_USER: staging
      POSTGRES_PASSWORD: staging
      POSTGRES_DB: staging
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "staging"]
      interval: 5s
      retries: 5
    volumes:
      - pgdata-staging:/var/lib/postgresql/data
      - ./sql/staging:/docker-entrypoint-initdb.d

  # Airflow Webserver
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Airflow Scheduler
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Airflow Init (runs once to set up DB and admin user)
  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/duckdb && chmod 777 /opt/airflow/duckdb
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin
        airflow connections add 'fs_default' --conn-type 'fs' --conn-extra '{"path": "/opt/airflow/data"}' || true
        echo "Airflow init complete."

  # Grafana for DE Dashboards
  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      postgres-staging:
        condition: service_healthy

  # Pipeline Controller API
  pipeline-api:
    image: python:3.10-slim
    container_name: clarity-pipeline-api
    working_dir: /app
    command: >
      bash -c "pip install --no-cache-dir fastapi uvicorn sqlalchemy psycopg2-binary requests &&
      uvicorn pipeline_controller_api:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./scripts:/app
      - ./data:/opt/airflow/data
      - ./duckdb:/opt/airflow/duckdb
    depends_on:
      postgres-staging:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy

volumes:
  pgdata-airflow:
  pgdata-staging:
  grafana-data: